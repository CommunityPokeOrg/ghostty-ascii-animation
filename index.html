<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ghostty ASCII Animation</title>
    <meta
      name="description"
      content="Standalone demo of the ASCII terminal animation from ghostty.org"
    />
    <link
      rel="preload"
      href="assets/fonts/jetbrains-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Fira+Code&family=IBM+Plex+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/terminal.css" />
    <link rel="stylesheet" href="assets/css/effects.css" />
  </head>
  <body>
    <main class="page">
      <section class="terminal-wrapper" id="terminal-wrapper" aria-hidden="true"></section>
      <p class="tagline">
        Ghostty is a fast, feature-rich, and cross-platform terminal emulator
        that uses platform-native UI and GPU acceleration.
      </p>
      <p class="credit">
        ASCII animation extracted from
        <a href="https://ghostty.org">ghostty.org</a>
        (<a href="https://github.com/ghostty-org/website">ghostty-org/website</a>,
        MIT License)
      </p>
    </main>

    <button
      type="button"
      class="fx-toggle"
      id="fx-toggle"
      aria-expanded="false"
      aria-controls="fx-panel"
    >
      Effects
    </button>

    <section
      class="fx-panel"
      id="fx-panel"
      role="region"
      aria-label="Visual effects controls"
      hidden
    >
      <h2 class="fx-heading">Effects</h2>

      <fieldset class="fx-group">
        <legend>Color &amp; tone</legend>
        <div class="fx-control">
          <label for="fx-hue">Hue rotate</label>
          <input type="range" id="fx-hue" data-fx="hue" min="0" max="360" step="1" />
          <output for="fx-hue" id="fx-hue-out"></output>
        </div>
        <div class="fx-control">
          <label for="fx-brightness">Brightness</label>
          <input type="range" id="fx-brightness" data-fx="brightness" min="0.2" max="2" step="0.05" />
          <output for="fx-brightness" id="fx-brightness-out"></output>
        </div>
        <div class="fx-control">
          <label for="fx-contrast">Contrast</label>
          <input type="range" id="fx-contrast" data-fx="contrast" min="0.2" max="2" step="0.05" />
          <output for="fx-contrast" id="fx-contrast-out"></output>
        </div>
        <div class="fx-control">
          <label for="fx-saturate">Saturation</label>
          <input type="range" id="fx-saturate" data-fx="saturate" min="0" max="3" step="0.05" />
          <output for="fx-saturate" id="fx-saturate-out"></output>
        </div>
        <div class="fx-control">
          <label for="fx-grayscale">Grayscale</label>
          <input type="range" id="fx-grayscale" data-fx="grayscale" min="0" max="1" step="0.05" />
          <output for="fx-grayscale" id="fx-grayscale-out"></output>
        </div>
        <div class="fx-control fx-control-check">
          <input type="checkbox" id="fx-invert" data-fx="invert" />
          <label for="fx-invert">Invert colors</label>
        </div>
      </fieldset>

      <fieldset class="fx-group">
        <legend>Glow</legend>
        <div class="fx-control fx-control-check">
          <input type="color" id="fx-glow-color" data-fx="glowColor" value="#3551f3" />
          <label for="fx-glow-color">Glow color</label>
        </div>
        <div class="fx-control">
          <label for="fx-glow-blur">Glow blur</label>
          <input type="range" id="fx-glow-blur" data-fx="glowBlur" min="0" max="40" step="1" />
          <output for="fx-glow-blur" id="fx-glow-blur-out"></output>
        </div>
        <div class="fx-control">
          <label for="fx-glow-spread">Glow intensity</label>
          <input type="range" id="fx-glow-spread" data-fx="glowSpread" min="0" max="30" step="1" />
          <output for="fx-glow-spread" id="fx-glow-spread-out"></output>
        </div>
        <div class="fx-control fx-control-check">
          <input type="checkbox" id="fx-afterglow" data-fx="afterglow" />
          <label for="fx-afterglow">Bloom / afterglow</label>
        </div>
        <div class="fx-control">
          <label for="fx-afterglow-blur">Afterglow intensity</label>
          <input type="range" id="fx-afterglow-blur" data-fx="afterglowBlur" min="0" max="30" step="1" />
          <output for="fx-afterglow-blur" id="fx-afterglow-blur-out"></output>
        </div>
      </fieldset>

      <fieldset class="fx-group">
        <legend>CRT</legend>
        <div class="fx-control fx-control-check">
          <input type="checkbox" id="fx-scanlines" data-fx="scanlines" />
          <label for="fx-scanlines">Scanlines</label>
        </div>
        <div class="fx-control">
          <label for="fx-scanline-opacity">Scanline intensity</label>
          <input type="range" id="fx-scanline-opacity" data-fx="scanlineOpacity" min="0" max="1" step="0.05" />
          <output for="fx-scanline-opacity" id="fx-scanline-opacity-out"></output>
        </div>
        <div class="fx-control fx-control-check">
          <input type="checkbox" id="fx-flicker" data-fx="flicker" />
          <label for="fx-flicker">Flicker</label>
        </div>
        <div class="fx-control">
          <label for="fx-flicker-amp">Flicker intensity</label>
          <input type="range" id="fx-flicker-amp" data-fx="flickerAmp" min="0" max="0.5" step="0.01" />
          <output for="fx-flicker-amp" id="fx-flicker-amp-out"></output>
        </div>
        <div class="fx-control fx-control-check">
          <input type="checkbox" id="fx-vignette" data-fx="vignette" />
          <label for="fx-vignette">Vignette</label>
        </div>
        <div class="fx-control fx-control-check">
          <input type="checkbox" id="fx-ca" data-fx="ca" />
          <label for="fx-ca">Chromatic aberration</label>
        </div>
        <div class="fx-control">
          <label for="fx-ca-amp">Aberration intensity</label>
          <input type="range" id="fx-ca-amp" data-fx="caAmp" min="0" max="4" step="0.1" />
          <output for="fx-ca-amp" id="fx-ca-amp-out"></output>
        </div>
        <div class="fx-control">
          <label for="fx-curve">Screen curvature</label>
          <input type="range" id="fx-curve" data-fx="curve" min="0" max="8" step="0.5" />
          <output for="fx-curve" id="fx-curve-out"></output>
        </div>
        <div class="fx-control fx-control-check">
          <input type="checkbox" id="fx-noise" data-fx="noise" />
          <label for="fx-noise">Noise / grain</label>
        </div>
        <div class="fx-control">
          <label for="fx-noise-opacity">Noise intensity</label>
          <input type="range" id="fx-noise-opacity" data-fx="noiseOpacity" min="0" max="0.3" step="0.01" />
          <output for="fx-noise-opacity" id="fx-noise-opacity-out"></output>
        </div>
      </fieldset>

      <fieldset class="fx-group">
        <legend>Text</legend>
        <div class="fx-control fx-control-select">
          <label for="fx-font">Font</label>
          <select id="fx-font" data-fx="font">
            <option value="jetbrains">JetBrains Mono</option>
            <option value="vt323">VT323</option>
            <option value="firacode">Fira Code</option>
            <option value="plex">IBM Plex Mono</option>
            <option value="courier">Courier New</option>
          </select>
        </div>
        <div class="fx-control fx-control-select">
          <label for="fx-phosphor">Phosphor</label>
          <select id="fx-phosphor" data-fx="phosphor">
            <option value="default">Default</option>
            <option value="amber">Amber</option>
            <option value="green">Green</option>
          </select>
        </div>
        <div class="fx-control">
          <label for="fx-line-height">Line height</label>
          <input type="range" id="fx-line-height" data-fx="lineHeight" min="0.8" max="2" step="0.05" />
          <output for="fx-line-height" id="fx-line-height-out"></output>
        </div>
        <div class="fx-control">
          <label for="fx-letter-spacing">Letter spacing</label>
          <input type="range" id="fx-letter-spacing" data-fx="letterSpacing" min="0" max="6" step="0.2" />
          <output for="fx-letter-spacing" id="fx-letter-spacing-out"></output>
        </div>
        <div class="fx-control">
          <label for="fx-scale">Scale</label>
          <input type="range" id="fx-scale" data-fx="scale" min="0.5" max="2" step="0.05" />
          <output for="fx-scale" id="fx-scale-out"></output>
        </div>
      </fieldset>

      <button type="button" class="fx-reset" id="fx-reset">Reset to defaults</button>
    </section>

    <div class="fx-scanlines" id="fx-scanlines-overlay" aria-hidden="true" hidden></div>
    <div class="fx-flicker" id="fx-flicker-overlay" aria-hidden="true" hidden></div>
    <div class="fx-vignette" id="fx-vignette-overlay" aria-hidden="true" hidden></div>
    <div class="fx-noise" id="fx-noise-overlay" aria-hidden="true" hidden></div>

    <script src="assets/js/frames.js"></script>
    <script src="assets/js/terminal.js"></script>
    <script src="assets/js/effects.js"></script>
  </body>
</html>
